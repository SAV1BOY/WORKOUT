<svg xmlns="http://www.w3.org/2000/svg" class="exfig" viewBox="0 0 132 100" role="img" aria-label="Execução de Prancha: posição inicial em cinza, posição final em destaque, seta indicando o sentido do movimento"><style>:root{--fig:#1F5673;--fig-gh:#B6C4CE;--eqc:#5E6A73;--arwc:#9C4A22}@media (prefers-color-scheme:dark){:root{--fig:#7FB2CE;--fig-gh:#3B464E;--eqc:#8A959D;--arwc:#DE9A66}}.exfig{width:100%;height:auto;display:block}.fl{stroke-linecap:round;fill:none}.sl.fl{stroke:var(--fig);stroke-width:4.2}.sl.fh{fill:var(--fig);stroke:none}.gh.fl{stroke:var(--fig-gh);stroke-width:4.2}.gh.fh{fill:var(--fig-gh);stroke:none}.eq{fill:none;stroke:var(--eqc);stroke-width:2.4;stroke-linecap:round}.eq.plate{fill:var(--eqc);stroke:none}.eq.bar{stroke-width:2.8}.eq.prop{stroke-width:2.6}.eq.floor{stroke-width:2;stroke:var(--eqc);opacity:.7}.eq.wall{stroke-width:3;stroke:var(--eqc);opacity:.55}.eq.cable{stroke-width:1.4;stroke:var(--eqc);opacity:.8}.eq.mat{stroke-width:3.4;stroke:var(--eqc);opacity:.6}.arw{stroke:var(--arwc);stroke-width:2.6;stroke-linecap:round;fill:none}.arw.dash{stroke-dasharray:4 4}.arwh{fill:var(--arwc)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="arwh"/></marker></defs><line x1="6" y1="94" x2="126" y2="94" class="eq floor"/><circle cx="28.0" cy="62.0" r="6" class="sl fh"/><line x1="40.0" y1="66.0" x2="66.0" y2="70.0" class="sl fl"/><line x1="66.0" y1="70.0" x2="86.0" y2="80.0" class="sl fl"/><line x1="86.0" y1="80.0" x2="100.0" y2="94.0" class="sl fl"/><line x1="40.0" y1="66.0" x2="40.0" y2="78.0" class="sl fl"/><line x1="40.0" y1="78.0" x2="30.0" y2="80.0" class="sl fl"/><line x1="28.0" y1="67.0" x2="40.0" y2="66.0" class="sl fl"/><line x1="100.0" y1="94.0" x2="107.0" y2="94.0" class="sl fl"/><line x1="30" y1="86" x2="100" y2="86" class="eq mat"/><line x1="40" y1="56" x2="86" y2="60" class="arw dash"/></svg>